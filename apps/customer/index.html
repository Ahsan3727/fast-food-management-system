<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>FastFood — Order Online</title>
    <meta name="description" content="Order fresh food delivered to your door. Track your order live." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', sans-serif; }
      #root { min-height: 100dvh; }
    </style>
    <!-- Apply saved theme before React mounts to avoid flash of wrong theme -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('ember_customer_theme') || '{}');
        var t = s && s.state && s.state.theme;
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
