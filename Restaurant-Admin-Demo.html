<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FastFood Admin · Ember demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0C0A09;--surface:#1C1917;--raised:#292524;--sunken:#141210;--text:#FAFAF9;--muted:#D6D3D1;--subtle:#A8A29E;--border:#44403C;--strong:#78716C;--action:#F97316;--action-h:#FB923C;--action-fg:#1C1917;--link:#FB923C;--focus:#93C5FD;--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--okbg:rgba(34,197,94,.16);--badbg:rgba(239,68,68,.16);--shadow:none;--chart:#F97316;--ease:cubic-bezier(.2,0,0,1);--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=light]{color-scheme:light;--bg:#FAFAF9;--surface:#fff;--raised:#fff;--sunken:#F5F5F4;--text:#1C1917;--muted:#57534E;--subtle:#78716C;--border:#E7E5E4;--action:#C2410C;--action-h:#9A3412;--action-fg:#fff;--link:#C2410C;--focus:#1D4ED8;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--okbg:#F0FDF4;--badbg:#FEF2F2;--shadow:0 1px 2px rgb(28 25 23/.06),0 1px 1px rgb(28 25 23/.04);--chart:#EA580C}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:400 14px/20px var(--font);background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1{font:700 24px/32px var(--font);margin-inline-end:auto}
.card h2,.col h2{font:600 17px/24px var(--font)}
dialog h2,.dh h2{font:700 20px/28px var(--font)}
h3{font:600 13px/18px var(--font);color:var(--muted);margin:16px 0 4px}
.sm{font-size:13px;line-height:18px;color:var(--subtle)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px 12px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--action);color:var(--action-fg);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:17px;line-height:20px}
.brand span.tag{font-size:12px;color:var(--subtle)}
#nav{display:grid;gap:4px;flex:1;align-content:start}
.ni{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;cursor:pointer;position:relative}
.ni:hover{background:var(--sunken)}
.ni[aria-current=page]{background:var(--sunken);color:var(--link)}
.nb{margin-inline-start:auto;min-width:22px;height:22px;border-radius:11px;background:var(--action);color:var(--action-fg);font:700 12px/22px var(--font);text-align:center;padding:0 6px}
.top{position:sticky;top:0;z-index:20;min-height:64px;display:flex;align-items:center;gap:8px;padding:8px 24px;background:var(--bg);border-bottom:1px solid var(--border)}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--strong);border-radius:12px;background:var(--surface);padding:0 12px;height:40px;color:var(--subtle);flex:1;max-width:320px}
.srch input{flex:1;min-width:0;border:0;background:none;outline:0}
.srch:focus-within{outline:2px solid var(--focus)}
kbd{font:500 12px/16px var(--font);border:1px solid var(--border);border-radius:4px;padding:0 6px}
.lv{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;background:none;font-weight:600;color:var(--ok);cursor:pointer}
.lv i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.lv.off{color:var(--bad)}.lv.off i{animation:none}
@keyframes pulse{50%{opacity:.35}}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:0;background:none;color:var(--muted);cursor:pointer;list-style:none;position:relative}
.ib:hover{background:var(--sunken);color:var(--text)}
summary::-webkit-details-marker{display:none}
.cnt{position:absolute;top:4px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--action);color:var(--action-fg);font:700 12px/18px var(--font);padding:0 4px}
.av{width:36px;height:36px;border-radius:50%;background:#FED7AA;color:#1C1917;font-weight:700;display:grid;place-items:center;flex:none}
summary.av{width:44px;height:44px;cursor:pointer;list-style:none;background:none}
summary.av::before{content:attr(data-i);width:36px;height:36px;border-radius:50%;background:#FED7AA;color:#1C1917;display:grid;place-items:center}
details.mn{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);min-width:220px;background:var(--raised);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 12px rgb(28 25 23/.16);padding:4px;z-index:30;display:grid}
.tk .menu{top:auto;bottom:calc(100% + 4px)}
.menu button{border:0;background:none;text-align:start;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--sunken)}
.menu [aria-pressed=true]{font-weight:700;color:var(--link)}
.pad{padding:8px 12px}
main{padding:24px;max-width:1440px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-content:start}
main>*,.g2>*,.g4>*{min-width:0}
.note{display:none;background:var(--badbg);color:var(--text);padding:8px 24px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.flush{padding:0;overflow:hidden}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.st{display:grid;gap:4px}
.big{font:800 clamp(22px,2.2vw,32px)/40px var(--font);white-space:nowrap}
.hint{display:flex;gap:4px;align-items:center;color:var(--muted)}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px}
.end{justify-content:flex-end;margin-top:20px}
.bar{display:flex;gap:16px;align-items:center}
.btn{min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--strong);background:none;font-weight:600;cursor:pointer;transition:transform 100ms}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:32px;padding:0 12px}
.btn.p{background:var(--action);color:var(--action-fg);border-color:transparent}
.btn.p:hover{background:var(--action-h)}
.btn.d{background:var(--bad);color:var(--action-fg);border-color:transparent}
.lnk{border:0;background:none;color:var(--link);font-weight:700;cursor:pointer;padding:0}
.lnk:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px}
.seg [aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--strong);background:none;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:500}
.chip[aria-pressed=true]{background:var(--action);color:var(--action-fg);border-color:transparent}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:16px;overflow-x:auto;align-items:start}
.col{background:var(--sunken);border-radius:16px;padding:12px;display:grid;gap:12px;align-content:start}
.col h2{display:flex;gap:8px;align-items:center}
.ct{background:var(--surface);border-radius:999px;padding:0 8px;font-size:13px}
.tk{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:grid;gap:8px;box-shadow:var(--shadow)}
.tk.new{animation:in 240ms var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(-12px)}}
.age{display:inline-flex;gap:4px;align-items:center;font-weight:600;color:var(--muted)}
.age.warn{color:var(--warn)}.age.bad,.sub.bad{color:var(--bad)}
.sub{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--sunken);text-align:start;font:600 12px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 16px;white-space:nowrap}
td{padding:8px 16px;height:48px;border-top:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--sunken)}
tr[data-o]{cursor:pointer}
.sb{border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;padding:0}
.bd{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--sunken);color:var(--muted)}
.bd.ok{background:var(--okbg);color:var(--ok)}.bd.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;margin-inline-end:6px}
.bd.no{background:var(--badbg);color:var(--bad)}
.warn{display:inline-flex;gap:4px;align-items:center;color:var(--warn);font-weight:600}
.it{display:flex;gap:12px;align-items:center}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.sw{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-weight:600;min-height:32px}
.sw i{width:36px;height:20px;border-radius:999px;background:var(--strong);position:relative;transition:background 160ms}
.sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform 160ms var(--ease)}
.sw[aria-checked=true] i{background:var(--ok)}.sw[aria-checked=true] i::after{transform:translateX(16px)}
.lo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.card h2+.lo{margin-top:8px}
.ch{width:100%;height:auto;margin-top:8px}.ch text{fill:var(--subtle);font-size:12px}.ch .dl{fill:var(--text);font-weight:600}
.tp{margin-top:16px;display:grid;gap:6px}
.trk{height:8px;border-radius:4px;background:var(--sunken)}.trk i{display:block;height:100%;border-radius:4px;background:var(--chart)}
.empty{padding:40px;text-align:center;display:grid;gap:12px;justify-items:center}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity 240ms;z-index:35}.sc.open{opacity:1;pointer-events:auto}
.dr{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--raised);border-inline-start:1px solid var(--border);box-shadow:0 12px 32px rgb(28 25 23/.16);transform:translateX(100%);transition:transform 240ms var(--ease);z-index:36;overflow-y:auto;visibility:hidden}
.dr.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--raised)}
.dh .bd{margin-top:4px}
.db{padding:8px 24px 24px}
.db ul,.db ol{padding-inline-start:0;list-style:none;display:grid;gap:4px}
.db li{display:flex;justify-content:space-between;gap:12px}
label{display:grid;gap:4px;margin-top:12px;font-weight:600}
input[type=number],input:not([type]),select{height:40px;border:1px solid var(--strong);border-radius:8px;background:var(--surface);padding:0 12px;font-weight:400;width:100%}
dialog{border:1px solid var(--border);background:var(--raised);color:var(--text);border-radius:16px;padding:24px;max-width:420px;width:calc(100% - 32px);box-shadow:0 12px 32px rgb(28 25 23/.16);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog p{margin-top:8px;color:var(--muted)}
.toasts{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:50}
.toast{background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-top:8px;box-shadow:0 4px 12px rgb(28 25 23/.16);animation:in 240ms var(--ease)}
#pv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:grid;place-content:center;justify-items:center;gap:12px;padding:16px}#pv iframe{width:390px;max-width:100%;height:min(800px,calc(100vh - 96px));border:10px solid #292524;border-radius:40px;background:var(--bg);box-shadow:0 12px 32px rgb(0 0 0/.5)}
@media(max-width:1279px){.app{grid-template-columns:72px minmax(0,1fr)}.lb,.brand div{display:none}.ni{justify-content:center}.nb{position:absolute;top:2px;inset-inline-end:2px;margin:0}.g2{grid-template-columns:1fr}}
@media(max-width:767px){
.app{grid-template-columns:minmax(0,1fr)}
.nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:0 0 env(safe-area-inset-bottom);gap:0;border-inline-end:0;border-top:1px solid var(--border);z-index:25}
.brand,.nav>.ni,[data-a=mob]{display:none}
#nav{display:flex;flex:1;gap:0}
.ni{flex:1;min-width:0;flex-direction:column;gap:2px;justify-content:center;min-height:56px;padding:0;font-size:12px;font-weight:500;letter-spacing:-.02em}
.lb{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.nb{top:2px;inset-inline-end:calc(50% - 22px)}
.top{padding:8px 12px;gap:4px;flex-wrap:wrap}
h1{font-size:20px;line-height:28px}
.srch{order:9;flex:1 1 100%;max-width:none}.srch kbd{display:none}
input,select{font-size:16px!important}
.lv{padding:0 8px}
main{padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
.g4{grid-template-columns:1fr 1fr;gap:12px}.big{font-size:22px;line-height:32px}.card:not(.flush){padding:16px}
.board{grid-template-columns:repeat(4,85%);scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}.col{scroll-snap-align:start}
.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.grp{flex:none;flex-wrap:nowrap}.chip{white-space:nowrap}
table,tbody{display:block}thead{display:none}
tr{display:grid;gap:4px;padding:12px 16px;border-top:1px solid var(--border)}
td{display:flex;justify-content:space-between;align-items:center;gap:12px;height:auto;min-height:28px;padding:0;border:0;white-space:normal;text-align:end}
td::before{content:attr(data-l);color:var(--subtle);font-size:13px;text-align:start}
td:first-child{justify-content:flex-start}td:first-child::before,td[data-l=Actions]::before{content:none}
td[data-l=Actions]{justify-content:flex-start;gap:8px;flex-wrap:wrap;padding-top:8px}
.lo{flex-wrap:wrap}
}
@media(max-width:340px){.g4{grid-template-columns:1fr}}
@media(max-width:380px){.ni:not([aria-current=page]) .lb{display:none}.ni[aria-current=page]{flex:2.4}
.dr{width:100%}.dh{padding:16px}.db{padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.toasts{inset-block-end:calc(72px + env(safe-area-inset-bottom));inset-inline:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="nav" aria-label="Sidebar">
 <div class="brand"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span><div><b>FastFood</b><span class="tag">Admin</span></div></div>
 <nav id="nav" aria-label="Main"></nav>
 <button class="ni" data-a="out" aria-label="Sign out"><span id="oi"></span><span class="lb">Sign out</span></button>
</aside>
<div>
 <header class="top">
  <h1 id="ttl"></h1>
  <label class="srch"><span id="si"></span><input id="q" type="search" placeholder="Search order # or customer" aria-label="Search orders"><kbd>/</kbd></label>
  <button id="live" class="lv" data-a="live"></button>
  <button id="snd" class="ib" data-a="snd" aria-label="New order sound"></button>
  <details class="mn" id="bell"><summary class="ib" aria-label="New orders"><span id="bi"></span><span class="cnt" id="uc" hidden></span></summary><div class="menu" id="bl"></div></details>
  <details class="mn"><summary class="av" data-i="A" aria-label="Account menu"></summary><div class="menu" id="avc"></div></details>
 </header>
 <main id="main" tabindex="-1"></main>
</div>
</div>
<div class="sc" data-a="close"></div>
<aside class="dr" id="dr" role="dialog" aria-modal="true" aria-label="Details"></aside>
<dialog id="dlg"></dialog>
<div class="toasts" id="ts" role="status" aria-live="polite"></div>
<div id="pv" hidden></div>
<script>
const $=(s,e=document)=>e.querySelector(s),dlg=$('#dlg');
const P={dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
rec:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
menu:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
bike:'<circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
chart:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
vol:'<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
volx:'<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
up:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'};
const I=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const rs=n=>'Rs. '+n.toLocaleString('en-PK');

can:v=>{const o=gt(v);ask(`Cancel order #${o.id}?`,'The customer will see the reason. They haven’t been charged, payment is cash on delivery.','Cancel order',w=>move(o,'CANCELLED','Admin',w),['Customer asked to cancel','Kitchen can’t fulfil it','Duplicate order','Other'])},
av:v=>{MN[v][5]^=1;render()},
edit:v=>{const m=MN[v];dr(`<header class="dh"><h2>Edit item</h2><button class="ib" data-a="close" aria-label="Close">${I('x')}</button></header><div class="db"><label>Name<input id="en" value="${m[1]}"></label><label>Base price (Rs.)<input id="ep" type="number" min="0" value="${m[4]}"></label><div class="r end"><button class="btn p" data-a="save" data-v="${v}">Save changes</button></div></div>`)},
save:v=>{MN[v][1]=$('#en').value||MN[v][1];MN[v][4]=+$('#ep').value||MN[v][4];A.close();render();toast('Changes saved')},
settle:v=>{const r=RD[v];ask(`Settle ${rs(r.c)} with ${r.n}?`,'Confirm you have received this cash from the rider.','Settle cash',()=>{r.c=0;render();toast('Cash settled')})},
susp:v=>{const[t,i]=v.split(':'),x=(t==='r'?RD:CU)[i];if(x.s){x.s=0;render();return toast(x.n+' restored')}ask(`Suspend ${x.n}?`,'They won’t be able to sign in until you restore them.','Suspend',()=>{x.s=1;render();toast(x.n+' suspended')},['Policy violation','Unpaid cash','Requested by customer','Other'])},
snd:()=>{snd=!snd;hdr()},live:()=>{live=!live;toast(live?'Live updates resumed':'Offline. New orders are paused.');hdr()},
theme:v=>{document.documentElement.dataset.theme=v;render()},
mob:()=>{const p=$('#pv');if(!p.hidden){p.hidden=true;p.innerHTML='';return}const f=document.createElement('iframe');f.title='Mobile preview';const c=document.documentElement.cloneNode(true);c.querySelector('#ts').innerHTML='';c.querySelector('#dr').innerHTML='';c.querySelector('#dr').className='dr';c.querySelector('.sc').className='sc';c.querySelector('#dlg').removeAttribute('open');f.srcdoc='<!doctype html>'+c.outerHTML;const b=document.createElement('button');b.className='btn p';b.dataset.a='mob';b.textContent='Close mobile preview';p.append(b,f);p.hidden=false;b.focus()},out:()=>toast('Sign out is turned off in this demo.')};
const hdr=()=>{$('#uc').textContent=unread;$('#uc').hidden=!unread;
$('#bl').innerHTML=feed.length?feed.map(o=>`<button data-a="open" data-v="${o.id}"><b>#${o.id}</b> ${o.c} · ${rs(tot(o))}</button>`).join(''):'<p class="sm pad">No new orders yet.</p>';
$('#live').className='lv'+(live?'':' off');$('#live').innerHTML=`<i></i>${live?'Live':'Offline'}`;
$('#snd').innerHTML=I(snd?'vol':'volx');$('#snd').setAttribute('aria-pressed',snd);$('#snd').title=snd?'Sound on':'Sound off';
$('#avc').innerHTML=`<p class="sm pad">Theme</p>${[['light','Light'],['dark','Dark']].map(([t,l])=>`<button data-a="theme" data-v="${t}" aria-pressed="${dk()===t}">${l}</button>`).join('')}${parent===window?'<button data-a="mob">Preview mobile view</button>':''}<button data-a="out">Sign out</button>`};
function render(){const need=O.filter(o=>o.s==='PLACED').length;
$('#ttl').textContent=NAV.find(n=>n[0]===page)[1];
$('#nav').innerHTML=NAV.map(([k,l,ic])=>`<button class="ni" data-a="nav" data-v="${k}" aria-label="${l}" ${page===k?'aria-current="page"':''}>${I(ic)}<span class="lb">${l}</span>${k==='orders'&&need?`<span class="nb">${need}</span>`:''}</button>`).join('');
$('#main').innerHTML=PG[page]();hdr();if(cur)$('#dr').innerHTML=dh(cur)}
document.addEventListener('click',e=>{document.querySelectorAll('details.mn[open]').forEach(d=>{if(!d.contains(e.target)||e.target.closest('[data-a]'))d.open=false});
const b=e.target.closest('[data-a]');if(b){A[b.dataset.a]?.(b.dataset.v);return}const r=e.target.closest('tr[data-o]');if(r)openD(+r.dataset.o)});
$('#bell').addEventListener('toggle',e=>{if(e.target.open&&unread){unread=0;hdr()}});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();page='orders';render()});
addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}if(e.key==='Escape'){if(!$('#pv').hidden)A.mob();else if($('#dr').classList.contains('open'))A.close()}});
const neo=()=>{if(!live)return;const[c,it]=POOL[nid%POOL.length],o=mk(nid++,c,'PLACED',0,it,{n:1});setTimeout(()=>o.n=0,3000);O.unshift(o);feed.unshift(o);feed.length=Math.min(feed.length,10);unread++;toast(`New order #${o.id} · ${rs(tot(o))}`);chime();render()};
$('#si').innerHTML=I('search',16);$('#bi').innerHTML=I('bell');$('#oi').innerHTML=I('out');
let lw=innerWidth,rz;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rz);rz=setTimeout(render,200)});
render();setTimeout(neo,9000);setInterval(neo,30000);setInterval(()=>{if(page==='orders'||page==='dash')render()},30000);
</script>
</body>
</html>
