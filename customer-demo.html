.av{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#DDD6FE;color:#1C1917;font:700 22px/1 var(--font)}

<div class="bar" role="toolbar" aria-label="Demo controls">
  <strong>FastFood · Customer demo</strong>
  <button data-a="theme" aria-pressed="false">Dark theme</button>

</div>
<main class="phone"><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div></main>

<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app'),rs=n=>'Rs. '+n.toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const TILES=['#FED7AA','#FDE68A','#FCE7F3','#D9F99D','#BAE6FD','#FECDD3','#DDD6FE','#99F6E4'];
const CATS=[['Burgers','🍔'],['Pizza','🍕'],['Sides','🍟'],['Drinks','🥤'],['Desserts','🍰'],['Salads','🥗']];
const M=[
{id:1,n:'Zinger Burger',d:'Crispy chicken, mayo, lettuce and a toasted bun',c:0,e:'🍔',s:[['Regular',450],['Large',600]],a:[['Cheese',50],['Fried egg',40],['Jalapeños',30]]},
{id:2,n:'Smash Beef Burger',d:'Double smashed patty, cheddar, house sauce',c:0,e:'🍔',s:[['Regular',550],['Large',720]],a:[['Cheese',50],['Fried egg',40]]},
{id:3,n:'Tikka Pizza',d:'Chicken tikka, onions, capsicum, mozzarella',c:1,e:'🍕',s:[['Medium',900],['Large',1250]],a:[['Extra cheese',120],['Olives',60]]},
{id:4,n:'Pepperoni Pizza',d:'Beef pepperoni, mozzarella, tomato base',c:1,e:'🍕',s:[['Medium',1050],['Large',1400]],a:[['Extra cheese',120]]},
{id:5,n:'Masala Fries',d:'Crinkle-cut fries tossed in chaat masala',c:2,e:'🍟',s:[['Regular',220],['Large',320]],a:[['Cheese sauce',60]]},
{id:6,n:'Hot Wings (6 pc)',d:'Glazed in a spicy, tangy sauce',c:2,e:'🍗',s:[['6 pieces',380]],a:[],off:1},
{id:7,n:'Mint Margarita',d:'Fresh mint, lemon, soda and crushed ice',c:3,e:'🥤',s:[['Regular',250],['Large',330]],a:[]},
{id:8,n:'Chilled Cola',d:'345 ml can',c:3,e:'🥤',s:[['Can',120]],a:[]},
{id:9,n:'Lava Cake',d:'Warm chocolate centre with a vanilla scoop',c:4,e:'🍰',s:[['Single',350]],a:[]},
{id:10,n:'Caesar Salad',d:'Grilled chicken, parmesan, croutons',c:5,e:'🥗',s:[['Regular',420]],a:[['Extra chicken',150]]}];
const byId=i=>M.find(m=>m.id==i);
/* One status table, as in §7 of the design system */
const ST={PLACED:['Order placed','blue','clipboard',1,'Waiting for the restaurant to accept your order.'],ACCEPTED:['Accepted','indigo','check',2,'The restaurant is getting started.'],PREPARING:['Preparing','amber','chef',3,'Your food is being cooked.'],READY:['Ready · finding a rider','teal','package',3,'Your order is packed. We are finding a rider.'],RIDER_ASSIGNED:['Rider on the way to restaurant','purple','bike',4,'Your rider is heading to the restaurant.'],PICKED_UP:['On the way to you','orange','nav',4,'Your rider is on the way. Keep your delivery code ready.'],DELIVERED:['Delivered','green','check',5,'Enjoy your meal.'],CANCELLED:['Cancelled','stone','ban',0,'']};
const FLOW=['PLACED','ACCEPTED','PREPARING','READY','RIDER_ASSIGNED','PICKED_UP','DELIVERED'];
const STEPS=[['Placed','clipboard'],['Accepted','check'],['Preparing','chef'],['On the way','bike'],['Delivered','home']];
const REASONS=['Changed my mind','Ordered by mistake','Taking too long','Other'];
const live=o=>o.st!=='DELIVERED'&&o.st!=='CANCELLED';
const fee=s=>s>=1000?0:100,osub=o=>o.items.reduce((a,i)=>a+i[3],0);
const S={stack:[{n:'home'}],cart:[],cat:-1,q:'',seg:'active',loading:true,off:false,sheet:null,p:null,pin:{x:34,y:58},locOK:false,addr:'',lm:'',err:'',placing:false,seq:1043,last:'',
orders:[
{id:'FD-1038',st:'DELIVERED',t:'Yesterday, 8:12 pm',otp:'3907',ad:'House 14, Street 6, Gulberg III, Lahore',items:[['Tikka Pizza','Medium',1,900],['Chilled Cola','Can',2,240]]},
{id:'FD-1042',st:'PREPARING',t:'Today, 1:05 pm',otp:'4821',ad:'House 14, Street 6, Gulberg III, Lahore',items:[['Zinger Burger','Large + Cheese',2,1300],['Masala Fries','Regular',1,220]]}]};
const unit=(m,l)=>m.s[l.size][1]+l.ad.reduce((a,i)=>a+m.a[i][1],0),lineP=l=>unit(byId(l.id),l)*l.qty,sub=()=>S.cart.reduce((a,l)=>a+lineP(l),0),cnt=()=>S.cart.reduce((a,l)=>a+l.qty,0);
const badge=s=>`<span class="badge" data-tone="${ST[s][1]}">${ic(ST[s][2])}${ST[s][0]}</span>`;
const hdr=(t,r='')=>`<header class="hdr"><button class="ib" data-a="back" aria-label="Back">${ic('left')}</button><h1>${t}</h1>${r}</header>`;
const cartBtn=()=>`<button class="ib" data-a="gocart" aria-label="Cart, ${cnt()} items">${ic('bag')}${cnt()?`<span class="badge-n">${cnt()}</span>`:''}</button>`;
const empty=(i,t,m,l,a,v)=>`<div class="empty"><div class="art">${ic(i)}</div><h2>${t}</h2><p class="mut">${m}</p><button class="btn primary" data-a="${a}" data-v="${v}">${l}</button></div>`;
const skel=(h,w='100%')=>`<div class="skel" style="height:${h}px;width:${w}"></div>`;
const price=(s,est=1)=>{const f=fee(s);return`<div class="card"><div class="sum"><span>Subtotal</span><span>${rs(s)}</span></div><div class="sum"><span>Delivery fee</span><span>${f?rs(f):'Free'}</span></div><div class="sum tot"><span>Total${est?' (est.)':''}</span><span>${rs(s+f)}</span></div>${est&&s<1000?`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="${s}"><i style="width:${s/10}%"></i></div><p class="sm mut">Add ${rs(1000-s)} more for free delivery</p>`:''}${est?'<p class="sm mut">Final price confirmed by the restaurant.</p>':''}</div>`};
const tile=(m,c='')=>`<div class="tile ${c}" style="background:${TILES[m.c%8]}" aria-hidden="true">${m.e}</div>`;
const card=m=>`<article class="mc"><button class="mc-l" data-a="open" data-v="${m.id}" aria-label="${esc(m.n)}, ${rs(m.s[0][1])}${m.off?', sold out':''}"><div class="tile" style="background:${TILES[m.c%8]}">${m.e}${m.off?'<span class="sold">Sold out</span>':''}</div><h3>${m.n}</h3></button><div class="mc-f"><span class="price">${rs(m.s[0][1])}</span><button class="ib fill" data-a="quick" data-v="${m.id}" aria-label="Add ${esc(m.n)}" ${m.off?'disabled':''}>${ic('plus')}</button></div></article>`;
const row=m=>`<div class="mr ${m.off?'dim':''}"><button class="mr-l" data-a="open" data-v="${m.id}">${tile(m,'sm')}<div class="mr-t"><h3>${m.n}${m.off?'<span class="tag">Sold out</span>':''}</h3><p class="mut sm clamp">${m.d}</p><span class="price">${rs(m.s[0][1])}</span></div></button><button class="ib fill" data-a="quick" data-v="${m.id}" aria-label="Add ${esc(m.n)}" ${m.off?'disabled':''}>${ic('plus')}</button></div>`;
const results=()=>{const q=S.q.trim().toLowerCase();if(q.length===1)return'<p class="mut" style="padding:16px 0">Type at least 2 characters.</p>';
const l=M.filter(m=>(S.cat<0||m.c===S.cat)&&(q.length<2||(m.n+' '+m.d).toLowerCase().includes(q)));
return l.length?l.map(row).join(''):`<p class="mut" style="padding:16px 0">No results for “${esc(S.q)}” — try a shorter word.</p>`};
const step=(q,a,k,del)=>`<div class="step" role="group" aria-label="Quantity"><button class="ib" data-a="${a}" data-v="-1" data-k="${k}" aria-label="${del&&q===1?'Remove item':'Decrease quantity'}">${ic(del&&q===1?'trash':'minus')}</button><output aria-live="polite">${q}</output><button class="ib" data-a="${a}" data-v="1" data-k="${k}" aria-label="Increase quantity" ${q>=50?'disabled':''}>${ic('plus')}</button></div>`;
const opt=(t,on,a,i,l,p)=>`<button class="opt" role="${t}" aria-checked="${on}" data-a="${a}" data-v="${i}"><span class="mk ${t}">${on?ic('check'):''}</span><span class="grow">${l}</span><span class="price">${p}</span></button>`;
const tracker=o=>{const cur=ST[o.st][3];return`<ol class="trk">${STEPS.map((s,i)=>{const n=i+1,c=n<cur||cur===5?'done':n===cur?'now':'';return`<li class="${c}" ${n===cur?'aria-current="step"':''}><span class="dot">${ic(s[1])}</span><span>${s[0]}</span></li>`}).join('')}</ol><p class="subl"><b>${ST[o.st][0]}</b><br>${ST[o.st][4]}</p>`};
const mapw=(pins,drag)=>`<div class="mapw ${drag?'drag':''}" ${drag?'id="mapd"':''}><svg class="bg" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60H300M0 140H300M80 0V200M210 0V200M0 190 300 20" stroke="var(--map-road)" stroke-width="12" fill="none" vector-effect="non-scaling-stroke"/></svg>${pins}<span class="attr">Demo map</span></div>`;
const pin=(k,i,x,y,l,extra='')=>`<div class="pin ${k}" role="img" aria-label="${l}" style="left:${x}%;top:${y}%" ${extra}>${ic(i)}</div>`;

const SCR={
home:()=>{const a=S.orders.filter(live).at(-1);
return`<div class="screen"><div class="top"><div><h1>Hi, Hira</h1><p class="mut">What are you craving today?</p></div>${cartBtn()}</div>
<label class="search">${ic('search')}<input id="hs" type="search" placeholder="Search burgers, pizza…" aria-label="Search the menu"></label>
${S.loading?`${skel(64)}<div style="height:16px"></div>${skel(36,'70%')}<div style="height:16px"></div><div class="grid2">${skel(190)}${skel(190)}</div>`:
`${a?`<button class="card live strip" data-a="track" data-v="${a.id}"><div class="grow"><b>#${a.id}</b><div style="margin-top:4px">${badge(a.st)}</div></div><span class="link btn ghost" style="min-height:36px;padding:0">Track${ic('right')}</span></button>`:''}
<div class="sec"><h2>Categories</h2><button class="lnk" data-a="catall">See all</button></div>
<div class="chips">${CATS.map((c,i)=>`<button class="chip" data-a="cat" data-v="${i}"><span aria-hidden="true">${c[1]}</span>${c[0]}</button>`).join('')}</div>
<div class="sec"><h2>Menu favourites</h2></div><div class="grid2">${M.slice(0,6).map(card).join('')}</div>`}</div>`},
menu:()=>`<div class="screen"><div class="top"><h1>Menu</h1>${cartBtn()}</div><label class="search">${ic('search')}<input id="ms" type="search" value="${esc(S.q)}" placeholder="Search the menu" aria-label="Search the menu"></label>
<div class="chips sticky"><button class="chip" data-a="pill" data-v="-1" aria-pressed="${S.cat<0}">${S.cat<0?ic('check'):''}All</button>${CATS.map((c,i)=>`<button class="chip" data-a="pill" data-v="${i}" aria-pressed="${S.cat===i}">${S.cat===i?ic('check'):`<span aria-hidden="true">${c[1]}</span>`}${c[0]}</button>`).join('')}</div><div id="res">${results()}</div></div>`,
product:v=>{const m=byId(v.id),p=S.p,u=m.s[p.size][1]+p.ad.reduce((a,i)=>a+m.a[i][1],0);
return`<div class="screen flush"><div class="hero" style="background:${TILES[m.c%8]}"><button class="ib float" data-a="back" aria-label="Back">${ic('left')}</button><span aria-hidden="true">${m.e}</span></div><div class="pad"><h1>${m.n}</h1><p class="mut">${m.d}</p>
<h2 class="sub">Size</h2><div class="opts" role="radiogroup" aria-label="Size">${m.s.map((s,i)=>opt('radio',i===p.size,'size',i,s[0],rs(s[1]))).join('')}</div>
${m.a.length?`<h2 class="sub">Add-ons</h2><div class="opts">${m.a.map((a,i)=>opt('checkbox',p.ad.includes(i),'addon',i,a[0],'+'+rs(a[1]))).join('')}</div>`:''}
<h2 class="sub">Notes for the kitchen <span class="mut sm">(optional)</span></h2><textarea id="notes" maxlength="200" rows="3" aria-label="Notes for the kitchen">${esc(p.notes)}</textarea><p class="mut sm" id="nc">${p.notes.length}/200</p></div></div>
<div class="foot">${step(p.qty,'pq',0)}<button class="btn primary lg" data-a="addcart" ${m.off?'disabled':''}>${m.off?'Sold out':'Add · '+rs(u*p.qty)}</button></div>`},
cart:()=>{if(!S.cart.length)return`<div class="screen">${hdr('Cart')}${empty('bag','Your cart is empty','Add something tasty and it will show up here.','Browse menu','tab','menu')}</div>`;
const s=sub();return`<div class="screen">${hdr('Cart','<button class="lnk" data-a="clear">Clear</button>')}${S.cart.map((l,i)=>{const m=byId(l.id);return`<div class="line">${tile(m,'sm')}<div class="grow"><h3>${m.n}</h3><p class="sm mut">${m.s[l.size][0]}</p>${l.ad.map(a=>`<p class="sm mut">+ ${m.a[a][0]}</p>`).join('')}${l.notes?`<p class="sm mut">“${esc(l.notes)}”</p>`:''}<b>${rs(lineP(l))}</b></div>${step(l.qty,'cq',i,1)}</div>`}).join('')}<div style="height:16px"></div>${price(s)}</div><div class="foot"><button class="btn primary lg" data-a="checkout">Checkout · ${rs(s+fee(s))}</button></div>`},
checkout:()=>{const s=sub(),t=s+fee(s),bad=S.err&&S.addr.trim().length<10;
return`<div class="screen">${hdr('Checkout')}<h2 class="sub" style="margin-top:0">Deliver to</h2>
${mapw(pin('store','store',78,26,'Restaurant')+pin('home','pin',S.pin.x,S.pin.y,'Delivery location. Drag, or use arrow keys, to move.','id="pin" tabindex="0"'),1)}
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" data-a="loc">${ic('locate')}Use my location</button>${S.locOK?'':'<button class="btn ghost" data-a="confirmloc">Confirm this location</button>'}</div>
${S.locOK?'':'<p class="sm mut" style="margin-top:8px">Move the pin to your door, or confirm this spot, to place your order.</p>'}
<label class="fl" for="addr">Address</label><input class="in" id="addr" value="${esc(S.addr)}" autocomplete="street-address" aria-invalid="${!!bad}" ${bad?'aria-describedby="ae"':''}>${bad?'<p class="err" id="ae" role="alert">Enter at least 10 characters, like house, street and area.</p>':''}
<label class="fl" for="lm">Landmark <span class="mut sm">(optional)</span></label><input class="in" id="lm" value="${esc(S.lm)}">
<div class="chips" style="margin-top:12px"><button class="chip" data-a="saved" data-v="House 14, Street 6, Gulberg III, Lahore">${ic('home')}Home</button><button class="chip" data-a="saved" data-v="Office 3B, MM Alam Road, Lahore">${ic('store')}Work</button></div>
<h2 class="sub">Payment</h2><div class="opts"><button class="opt" role="radio" aria-checked="true"><span class="mk radio">${ic('check')}</span><span class="grow"><b>Cash on delivery</b><br><span class="sm mut">Pay ${rs(t)} to the rider</span></span>${ic('cash')}</button></div>
<h2 class="sub">Order summary</h2>${price(s)}</div>
<div class="foot"><button class="btn primary lg" data-a="place" ${!S.locOK?'disabled':''} ${S.placing?'aria-busy="true"':''}>${S.placing?'Placing order…':'Place order · '+rs(t)}</button></div>`},
placed:v=>`<div class="screen" style="display:grid;align-content:center;justify-items:center;text-align:center;gap:12px"><div class="art" style="display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--success);color:var(--action-fg)"><svg class="ic" style="width:48px;height:48px;stroke-width:2.5"><use href="#i-check"/></svg></div><h1>Order #${v.id} placed 🎉</h1><p class="mut">We’ll tell you when the restaurant accepts it. Payment is cash on delivery.</p><button class="btn primary lg" data-a="trackrep" data-v="${v.id}">Track order</button><button class="btn ghost" data-a="tab" data-v="menu">Back to menu</button></div>`,
orders:()=>{const l=S.orders.filter(o=>S.seg==='active'?live(o):!live(o)).reverse();
return`<div class="screen"><h1 style="margin-bottom:16px">Orders</h1><div class="seg" role="tablist"><button role="tab" data-a="seg" data-v="active" aria-selected="${S.seg==='active'}">Active</button><button role="tab" data-a="seg" data-v="past" aria-selected="${S.seg==='past'}">Past</button></div>
${l.length?l.map(o=>`<div class="card ${live(o)?'live':''}"><button style="display:block;width:100%" data-a="order" data-v="${o.id}"><div style="display:flex;justify-content:space-between;align-items:center"><b>#${o.id}</b><span class="sm mut">${o.t}</span></div><div style="margin:8px 0">${badge(o.st)}</div><p class="sm mut">${o.items.map(i=>i[2]+' × '+i[0]).join(', ')}</p><b>${rs(osub(o)+fee(osub(o)))}</b></button>${live(o)?`<button class="btn secondary" style="margin-top:12px;min-height:40px" data-a="track" data-v="${o.id}">${ic('nav')}Track</button>`:''}</div>`).join(''):empty('receipt',S.seg==='active'?'No active orders':'No past orders yet','Hungry? Your next order will show up here.','Order now','tab','menu')}</div>`},
order:v=>{const o=S.orders.find(x=>x.id===v.id),s=osub(o);
return`<div class="screen">${hdr('Order #'+o.id)}<p class="sm mut" style="margin:-8px 0 12px">${o.t}</p>
${o.st==='CANCELLED'?`<div class="banner" data-tone="stone">${ic('ban')}<div><b>Order cancelled</b>${esc(o.why||'')}<br>You haven’t been charged — payment is cash on delivery.</div></div>`:`<div class="card">${tracker(o)}</div>`}
<div class="card"><h2>Items</h2>${o.items.map(i=>`<div class="sum"><span>${i[2]} × ${i[0]}<br><span class="sm mut">${i[1]}</span></span><span>${rs(i[3])}</span></div>`).join('')}</div>
<div class="card"><h2>Delivery address</h2><p>${esc(o.ad)}</p></div>${price(s,0)}<p class="sm mut" style="margin-bottom:16px">${ic('cash')} Cash on delivery — ${rs(s+fee(s))}</p>
${live(o)?`<button class="btn primary lg" data-a="track" data-v="${o.id}">Track order</button>`:''}${o.st==='PLACED'?`<button class="btn ghost lg" style="margin-top:8px" data-a="cancel" data-v="${o.id}">Cancel order…</button>`:''}</div>`},
track:v=>{const o=S.orders.find(x=>x.id===v.id),i=FLOW.indexOf(o.st),r=i>=4&&o.st!=='DELIVERED',pos=o.st==='PICKED_UP'?[46,50]:[72,32];
return`<div class="screen">${hdr('Order #'+o.id)}<p style="margin-bottom:12px"><span class="live-dot"></span><b>Live</b> · ${ST[o.st][0]}</p>
${mapw(pin('store','store',78,26,'Restaurant')+pin('home','pin',24,74,'Your address')+(r?pin('rider','bike',pos[0],pos[1],'Your rider'):''))}
${o.st==='PICKED_UP'?`<div class="otp"><b>Delivery code</b><output aria-label="Delivery code ${o.otp.split('').join(' ')}">${o.otp}</output><p class="sm mut">Show this code to the rider at delivery. Don’t share it with anyone else.</p></div>`:''}
${o.st==='RIDER_ASSIGNED'?'<div class="card"><p class="mut">Waiting for live location…</p></div>':''}
${r?`<div class="card" style="display:flex;align-items:center;gap:12px"><div class="av" style="width:44px;height:44px;font-size:18px">B</div><div class="grow"><b>Bilal</b><br><span class="sm mut">Honda CD70</span></div><button class="btn secondary" style="min-height:40px" data-a="call">Call</button></div>`:''}
<div class="card">${tracker(o)}</div></div>`},
profile:()=>`<div class="screen"><h1 style="margin-bottom:16px">Profile</h1><div style="display:flex;align-items:center;gap:16px;margin-bottom:16px"><div class="av" aria-hidden="true">H</div><div><h2>Hira Khan</h2><p class="mut">+92 300 1234567</p></div></div>
<button class="prow" data-a="tab" data-v="orders">${ic('receipt')}<span class="grow">My orders</span>${ic('right')}</button>
<div class="prow">${ic('home')}<span class="grow" id="dl">Dark theme</span><button class="sw" role="switch" aria-labelledby="dl" aria-checked="${document.documentElement.dataset.theme==='dark'}" data-a="theme"></button></div>
<button class="prow" data-a="out" style="color:var(--danger)">${ic('out')}<span class="grow">Sign out</span></button><p class="sm mut" style="margin-top:16px">Saved addresses, settings and help are hidden until they are built, as the design system advises.</p></div>`};

const NAVV=['home','menu','orders','profile'];
const nav=()=>{const cur=S.stack[0].n,act=S.orders.some(live);return`<nav class="nav" aria-label="Main">${[['home','Home','home'],['menu','Menu','utensils'],['orders','Orders','receipt'],['profile','Profile','user']].map(([k,l,i])=>`<button data-a="tab" data-v="${k}" ${cur===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span>${k==='orders'&&act?'<i class="dot-a" role="img" aria-label="Active order"></i>':''}</button>`).join('')}</nav>`};
const cartbar=()=>{const n=cnt();return n&&['home','menu'].includes(S.stack.at(-1).n)?`<button class="cartbar" data-a="gocart"><span>${n} item${n>1?'s':''}</span><span>View cart</span><span>${rs(sub())}</span></button>`:''};
const sheet=()=>{const h=S.sheet,c=h.t==='cancel';
return`<div class="scrim" data-a="sx"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sht" tabindex="-1"><span class="grab"></span><h2 id="sht">${c?'Cancel this order?':'Clear your cart?'}</h2><p class="mut">${c?'The restaurant will be told right away.':'All items will be removed from your cart.'}</p>
${c?`<div class="opts" role="radiogroup" aria-label="Reason">${REASONS.map((r,i)=>opt('radio',h.r===i,'reason',i,r,'')).join('')}</div>${h.r===3?'<textarea id="why" rows="2" maxlength="200" style="margin-top:8px" aria-label="Tell us more" placeholder="Tell us more"></textarea>':''}`:''}
${h.err?`<p class="err" role="alert">${h.err}</p>`:''}<div class="acts"><button class="btn secondary" data-a="sx">${c?'Keep order':'Keep items'}</button><button class="btn danger" data-a="sok" ${h.busy?'aria-busy="true" disabled':''}>${h.busy?'Cancelling…':c?'Cancel order':'Clear cart'}</button></div></div>`};

function render(){const v=S.stack.at(-1),key=v.n+(v.id||''),sc=app.querySelector('.screen'),top=sc&&S.last===key?sc.scrollTop:0,f=document.activeElement,fd=f&&f.dataset&&f.dataset.a?f.dataset:null;
S.last=key;app.innerHTML=(S.off?'<div class="offl" role="status">You’re offline — showing your last orders</div>':'')+SCR[v.n](v)+(NAVV.includes(v.n)?cartbar()+nav():'')+(S.sheet?sheet():'');
const n=app.querySelector('.screen');if(n)n.scrollTop=top;
if(S.sheet&&!(fd&&fd.a==='reason'))app.querySelector('.sheet').focus();
else if(fd){const e=app.querySelector(`[data-a="${fd.a}"]${fd.v!==undefined?`[data-v="${CSS.escape(fd.v)}"]`:''}${fd.k!==undefined?`[data-k="${fd.k}"]`:''}`);e&&e.focus()}}
const go=(n,id)=>{S.stack.push({n,id});render()},tab=t=>{S.stack=[{n:t}];S.sheet=null;render()};
let tt;const toast=(m,a)=>{const t=$('#toast');t.innerHTML=`<span>${m}</span>${a?`<button data-a="${a[1]}">${a[0]}</button>`:''}`;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),a?4000:3000)};
const openP=id=>{S.p={id,size:0,ad:[],qty:1,notes:''};go('product',id)};
const addLine=(id,size,ad,notes,qty)=>{const k=id+':'+size+':'+[...ad].sort().join(),l=S.cart.find(x=>x.id+':'+x.size+':'+[...x.ad].sort().join()===k);l?l.qty=Math.min(50,l.qty+qty):S.cart.push({id,size,ad:[...ad],notes,qty})};
const cur=()=>S.orders.filter(live).at(-1);

const A={
tab:d=>{S.stack=[{n:d.v}];S.sheet=null;render()},theme:()=>{const r=document.documentElement,d=r.dataset.theme!=='dark';r.dataset.theme=d?'dark':'light';const b=$('[data-a=theme]');b.setAttribute('aria-pressed',d);b.textContent=d?'Light theme':'Dark theme';render()},
off:()=>{S.off=!S.off;const b=$('.bar [data-a=off]');b.setAttribute('aria-pressed',S.off);b.textContent=S.off?'Go online':'Go offline';render();toast(S.off?'You’re offline':'Back online')},
next:()=>{const o=cur();if(!o)return toast('No active order. Place one first.');o.st=FLOW[FLOW.indexOf(o.st)+1];render();toast(`#${o.id} · ${ST[o.st][0]}`)},reset:()=>location.reload(),
back:()=>{S.stack.length>1&&S.stack.pop();render()},gocart:()=>go('cart'),cartgo:()=>{$('#toast').classList.remove('on');go('cart')},
open:d=>openP(+d.v),cat:d=>{S.cat=+d.v;S.q='';tab('menu')},catall:()=>{S.cat=-1;tab('menu')},pill:d=>{S.cat=+d.v;render()},
quick:d=>{addLine(+d.v,0,[],'',1);render();toast('Added to cart',['View cart','cartgo'])},
size:d=>{S.p.size=+d.v;render()},addon:d=>{const a=S.p.ad,i=+d.v;a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);render()},
pq:d=>{S.p.qty=Math.max(1,Math.min(50,S.p.qty+ +d.v));render()},
addcart:()=>{const p=S.p;addLine(p.id,p.size,p.ad,p.notes.trim(),p.qty);render();toast('Added to cart',['View cart','cartgo'])},
cq:d=>{const l=S.cart[+d.k];l.qty+=+d.v;if(l.qty<1)S.cart.splice(+d.k,1);l&&(l.qty=Math.min(50,l.qty));render()},
clear:()=>{S.sheet={t:'clear'};render()},checkout:()=>go('checkout'),
loc:()=>{S.pin={x:30,y:70};S.locOK=true;if(!S.addr)S.addr='House 14, Street 6, Gulberg III, Lahore';render();toast('Location found')},confirmloc:()=>{S.locOK=true;render()},saved:d=>{S.addr=d.v;S.err='';render()},
place:()=>{if(S.addr.trim().length<10){S.err=1;render();return $('#addr').focus()}
if(S.off)return toast('You’re offline. Reconnect to place your order.');S.placing=true;render();
setTimeout(()=>{const id='FD-'+S.seq++;S.orders.push({id,st:'PLACED',t:'Just now',otp:String(1000+Math.floor(Math.random()*9000)),ad:S.addr+(S.lm?' ('+S.lm+')':''),items:S.cart.map(l=>{const m=byId(l.id);return[m.n,m.s[l.size][0]+l.ad.map(a=>' + '+m.a[a][0]).join(''),l.qty,lineP(l)]})});S.cart=[];S.placing=false;S.stack=[{n:'home'},{n:'placed',id}];render()},900)},
track:d=>go('track',d.v),trackrep:d=>{S.stack=[{n:'orders'},{n:'track',id:d.v}];render()},order:d=>go('order',d.v),seg:d=>{S.seg=d.v;render()},call:()=>toast('Calling Bilal…'),
cancel:d=>{S.sheet={t:'cancel',id:d.v,r:0,err:'',busy:0};render()},reason:d=>{S.sheet.r=+d.v;render()},sx:()=>{S.sheet=null;render()},
sok:()=>{const h=S.sheet;if(h.t==='clear'){S.cart=[];S.sheet=null;return render()}
h.busy=1;h.err='';render();setTimeout(()=>{const o=S.orders.find(x=>x.id===h.id);
if(S.off){h.busy=0;h.err='Couldn’t cancel. Check your connection and try again.'}
else if(o.st!=='PLACED'){h.busy=0;h.err='The restaurant has already accepted this order, so it can’t be cancelled here.'}
else{o.st='CANCELLED';o.why=h.r===3&&h.txt?h.txt:REASONS[h.r];S.sheet=null;toast('Order cancelled')}render()},700)},
out:()=>toast('Signed out (demo)')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset)}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='ms'){S.q=t.value;$('#res').innerHTML=results()}
else if(t.id==='notes'){S.p.notes=t.value;$('#nc').textContent=t.value.length+'/200'}
else if(t.id==='addr'){S.addr=t.value}else if(t.id==='lm'){S.lm=t.value}else if(t.id==='why'){S.sheet.txt=t.value}});
document.addEventListener('focusin',e=>{if(e.target.id==='hs'){tab('menu');setTimeout(()=>$('#ms')&&$('#ms').focus())}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}
if(e.target.id==='pin'&&e.key.startsWith('Arrow')){e.preventDefault();const d={ArrowLeft:[-5,0],ArrowRight:[5,0],ArrowUp:[0,-5],ArrowDown:[0,5]}[e.key];S.pin.x=Math.max(5,Math.min(95,S.pin.x+d[0]));S.pin.y=Math.max(15,Math.min(95,S.pin.y+d[1]));S.locOK=true;render()}});
/* draggable delivery pin */
let drag=0;const mv=e=>{const r=$('#mapd').getBoundingClientRect();S.pin.x=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100));S.pin.y=Math.max(15,Math.min(100,(e.clientY-r.top)/r.height*100));const p=$('#pin');p.style.left=S.pin.x+'%';p.style.top=S.pin.y+'%'};
document.addEventListener('pointerdown',e=>{if(e.target.closest('#mapd')){drag=1;e.target.closest('#mapd').setPointerCapture?.(e.pointerId);mv(e)}});
document.addEventListener('pointermove',e=>{drag&&$('#mapd')&&mv(e)});
document.addEventListener('pointerup',()=>{if(drag){drag=0;S.locOK=true;render();$('#pin')&&$('#pin').focus()}});
render();setTimeout(()=>{S.loading=false;render()},800);
</script>
</body>
</html>
