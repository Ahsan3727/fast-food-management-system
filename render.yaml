# Render deployment configuration
# Full FastFood Platform (API + Customer + Admin + Rider)
services:
  # ─── NestJS Backend API ───────────────────────
  - type: web
    name: fastfood-api
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /v1/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── Secrets — configured in Render dashboard ──
      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: REDIS_URL
        sync: false

      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Non-secret config ──
      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      - key: CORS_ORIGINS
        value: https://*.vercel.app,https://*.onrender.com,http://localhost:5173,http://localhost:5174,http://localhost:5175,https://localhost

  # ─── Customer App (Static Site) ───────────────
  - type: static
    name: fastfood-customer
    rootDir: apps/customer
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fast-food-management-system.onrender.com
      - key: VITE_SOCKET_URL
        value: https://fast-food-management-system.onrender.com

  # ─── Admin Dashboard (Static Site) ────────────
  - type: static
    name: fastfood-admin
    rootDir: apps/admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fast-food-management-system.onrender.com
      - key: VITE_SOCKET_URL
        value: https://fast-food-management-system.onrender.com

  # ─── Rider App (Static Site) ──────────────────
  - type: static
    name: fastfood-rider
    rootDir: apps/rider
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fast-food-management-system.onrender.com
      - key: VITE_SOCKET_URL
        value: https://fast-food-management-system.onrender.com
