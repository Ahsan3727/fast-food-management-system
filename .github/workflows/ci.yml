name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.3

      - name: Install dependencies
        run: pnpm install

      - name: Check Design Tokens (Customer)
        run: node scripts/check-tokens.mjs --app customer

      - name: Typecheck Customer App
        run: pnpm --filter @fastfood/customer typecheck

      - name: Typecheck API
        run: pnpm --filter @fastfood/api typecheck

      - name: Run Customer Tests (Vitest)
        run: pnpm --filter @fastfood/customer test

      - name: Run API Tests (Jest)
        run: pnpm --filter @fastfood/api test

      - name: Build Customer App
        run: pnpm --filter @fastfood/customer build

      - name: Build API
        run: pnpm --filter @fastfood/api build
